<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Limitless Tetris</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#050820">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Limitless Tetris">
<style>
  html,body{margin:0;height:100%;background:#050820;overflow:hidden;overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  canvas{display:block;width:100vw;height:100vh;height:100dvh;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(()=>{
"use strict";
const COLS=10, ROWS=20;
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
let W=0,H=0,dpr=1,cell=30,bx=0,by=0,bw=0,bh=0,hudH=80;

/* ---------- storage ---------- */
function lsGet(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
let best=parseInt(lsGet('blockdrop_best','0'))||0;
let muted=lsGet('blockdrop_muted','0')==='1';

/* ---------- audio ---------- */
let ac=null;
function unlock(){
  try{
    if(!ac){const A=window.AudioContext||window.webkitAudioContext; if(A) ac=new A();}
    if(ac&&ac.state==='suspended') ac.resume();
  }catch(e){}
}
function tone(f,d,type,v,slideTo,delay){
  if(!ac||muted) return;
  const t=ac.currentTime+(delay||0);
  const o=ac.createOscillator(), g=ac.createGain();
  o.type=type||'square'; o.frequency.setValueAtTime(f,t);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20,slideTo),t+d);
  g.gain.setValueAtTime(v||.08,t); g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+d+.02);
}
function noise(d,v,fc,delay){
  if(!ac||muted) return;
  const t=ac.currentTime+(delay||0);
  const n=Math.floor(ac.sampleRate*d), b=ac.createBuffer(1,n,ac.sampleRate), a=b.getChannelData(0);
  for(let i=0;i<n;i++) a[i]=(Math.random()*2-1);
  const s=ac.createBufferSource(); s.buffer=b;
  const f=ac.createBiquadFilter(); f.type='lowpass'; f.frequency.value=fc||800;
  const g=ac.createGain(); g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.0001,t+d);
  s.connect(f); f.connect(g); g.connect(ac.destination); s.start(t);
}
const sfx={
  move(){tone(480,.05,'square',.05)},
  step(){tone(300,.05,'triangle',.07,240)},
  rotate(){tone(620,.07,'triangle',.07,940)},
  lock(){tone(200,.07,'sine',.09,140)},
  slam(){noise(.2,.3,350); tone(130,.18,'sine',.25,45)},
  whoosh(){noise(.6,.12,2500)},
  sparkle(){tone(1500+Math.random()*1200,.08,'sine',.03)},
  start(){[523,659,784,1047].forEach((f,i)=>tone(f,.18,'triangle',.07,0,i*.07))},
  clear(n){const N=[523,659,784,1047,1319,1568];for(let i=0;i<Math.min(6,n+2);i++)tone(N[i],.22,'triangle',.08,0,i*.06);noise(.25,.1,3000)},
  over(){[392,330,262,196].forEach((f,i)=>tone(f,.3,'sawtooth',.05,f*.9,i*.16))},
  best(){[784,988,1175,1568].forEach((f,i)=>tone(f,.2,'triangle',.07,0,i*.09))},
  ui(){tone(700,.05,'square',.04)}
};
function buzz(ms){try{if(navigator.vibrate)navigator.vibrate(ms)}catch(e){}}

/* ---------- pieces ---------- */
const TYPES={
  I:{m:[[1,1,1,1]],c:'#00c8ff'},
  O:{m:[[1,1],[1,1]],c:'#ffd400'},
  T:{m:[[0,1,0],[1,1,1]],c:'#f02bf0'},
  S:{m:[[0,1,1],[1,1,0]],c:'#5fe02a'},
  Z:{m:[[1,1,0],[0,1,1]],c:'#ff1744'},
  J:{m:[[1,0,0],[1,1,1]],c:'#3a6bff'},
  L:{m:[[0,0,1],[1,1,1]],c:'#ff9100'}
};
const NAMES=Object.keys(TYPES);
let bag=[];
function nextType(){
  if(!bag.length){bag=NAMES.slice();for(let i=bag.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[bag[i],bag[j]]=[bag[j],bag[i]]}}
  return bag.pop();
}
function rotCW(m){const h=m.length,w=m[0].length,r=[];for(let x=0;x<w;x++){r.push([]);for(let y=h-1;y>=0;y--)r[x].push(m[y][x])}return r}

/* ---------- state ---------- */
let grid,cur,nextT,score,lines,level;
let dropAcc,lockT,lockResets,clearing,paused;
let phase='splash'; // splash | intro | play | closing | over
let introT=0,bannerT=-1,closeT=0,overT=0,newBest=false,splashT=0;
let particles=[],pops=[],trails=[],shake=0,flash=0;
const wall=[]; // splash wall colors

function newGame(){
  grid=Array.from({length:ROWS},()=>Array(COLS).fill(null));
  score=0;lines=0;level=0;paused=false;clearing=null;newBest=false;
  bag=[];nextT=nextType();particles=[];pops=[];trails=[];
  spawn();
}
function spawn(){
  const t=nextT; nextT=nextType();
  const m=TYPES[t].m.map(r=>r.slice());
  cur={t,m,c:TYPES[t].c,x:Math.floor((COLS-m[0].length)/2),y:0};
  dropAcc=0;lockT=0;lockResets=0;
  if(collide(cur.m,cur.x,cur.y)) gameOver();
}
function collide(m,x,y){
  for(let r=0;r<m.length;r++)for(let c=0;c<m[r].length;c++){
    if(!m[r][c])continue;
    const gx=x+c,gy=y+r;
    if(gx<0||gx>=COLS||gy>=ROWS)return true;
    if(gy>=0&&grid[gy][gx])return true;
  }
  return false;
}
function interval(){return Math.max(90,700*Math.pow(.88,level))}
function grounded(){return collide(cur.m,cur.x,cur.y+1)}
function bumpLock(){ if(grounded()&&lockResets<12){lockT=0;lockResets++} }

function tryMove(dx){
  if(phase!=='play'||paused||clearing||!cur)return false;
  if(!collide(cur.m,cur.x+dx,cur.y)){cur.x+=dx;sfx.move();buzz(5);bumpLock();return true}
  return false;
}
function softDrop(){
  if(phase!=='play'||paused||clearing||!cur)return;
  if(!collide(cur.m,cur.x,cur.y+1)){cur.y++;dropAcc=0;sfx.step()}
  else lockT=Math.max(lockT,300);
}
function hoverTo(px){
  if(!cur||phase!=='play'||paused||clearing)return;
  const w=cur.m[0].length;
  let tx=Math.floor((px-bx)/cell-w/2+.5);
  tx=Math.max(0,Math.min(COLS-w,tx));
  let n=0;
  while(cur.x<tx&&n++<COLS){if(!tryMove(1))break}
  while(cur.x>tx&&n++<COLS){if(!tryMove(-1))break}
}
function tryRotate(){
  if(phase!=='play'||paused||clearing||!cur||cur.t==='O')return;
  const m=rotCW(cur.m);
  const nx=cur.x+Math.floor((cur.m[0].length-m[0].length)/2);
  const kicks=[[0,0],[-1,0],[1,0],[-2,0],[2,0],[0,-1],[-1,-1],[1,-1]];
  for(const [kx,ky] of kicks){
    if(!collide(m,nx+kx,cur.y+ky)){cur.m=m;cur.x=nx+kx;cur.y+=ky;sfx.rotate();bumpLock();return}
  }
}
function slam(){
  if(phase!=='play'||paused||clearing||!cur)return;
  const y0=cur.y;let y=cur.y;
  while(!collide(cur.m,cur.x,y+1))y++;
  const dist=y-y0;
  // light trail per column
  for(let c=0;c<cur.m[0].length;c++){
    let top=-1,bot=-1;
    for(let r=0;r<cur.m.length;r++)if(cur.m[r][c]){if(top<0)top=r;bot=r}
    if(top<0)continue;
    trails.push({col:cur.x+c,r0:Math.max(0,y0+top-1),r1:y+bot,c:cur.c,t:0});
  }
  cur.y=y;
  shake=Math.min(10,4+dist*.4);
  sfx.slam();buzz(20);
  lock(true);
}
function lock(hard){
  for(let r=0;r<cur.m.length;r++)for(let c=0;c<cur.m[r].length;c++){
    if(cur.m[r][c]){const gy=cur.y+r,gx=cur.x+c;if(gy>=0)grid[gy][gx]=cur.c}
  }
  score+=10;
  if(!hard)sfx.lock();
  // dust sparkle at landing
  for(let c=0;c<cur.m[0].length;c++){
    for(let i=0;i<2;i++)particles.push({x:bx+(cur.x+c+.5)*cell,y:by+(cur.y+cur.m.length)*cell,vx:(Math.random()-.5)*60,vy:-Math.random()*50,life:.5,t:0,s:2+Math.random()*2,k:'dot',col:cur.c});
  }
  const full=[];
  for(let r=0;r<ROWS;r++)if(grid[r].every(v=>v))full.push(r);
  cur=null;
  if(full.length){
    clearing={rows:full,t:0};
    sfx.clear(full.length);buzz(40);
    for(const r of full)for(let c=0;c<COLS;c++){
      for(let i=0;i<2;i++)particles.push({x:bx+(c+.5)*cell,y:by+(r+.5)*cell,vx:(Math.random()-.5)*220,vy:-Math.random()*180-30,life:.7,t:0,s:3+Math.random()*3,k:'dia',col:grid[r][c]});
    }
    flash=.35;
  } else spawn();
}
function finishClear(){
  const rows=clearing.rows,n=rows.length;
  const pts=Math.round(100*n*(1+.5*(n-1)));
  const midR=rows.reduce((a,b)=>a+b,0)/n;
  rows.sort((a,b)=>a-b);
  for(const r of rows){grid.splice(r,1);grid.unshift(Array(COLS).fill(null))}
  score+=pts;lines+=n;level=Math.floor(lines/10);
  pops.push({text:'+'+pts,x:bx+bw/2,y:by+midR*cell,t:0});
  clearing=null;spawn();
}
function gameOver(){
  cur=null;phase='closing';closeT=0;
  if(score>best){best=score;lsSet('blockdrop_best',String(best));newBest=true}
  sfx.over();buzz(80);
}

/* ---------- input ---------- */
let g=null;
const btns={};
function layout(){
  dpr=Math.min(window.devicePixelRatio||1,3);
  W=window.innerWidth;H=window.innerHeight;
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  hudH=Math.max(64,Math.min(100,H*.11));
  cell=Math.floor(Math.min((W-20)/COLS,(H-hudH-36)/ROWS));
  bw=cell*COLS;bh=cell*ROWS;bx=Math.floor((W-bw)/2);by=Math.floor(hudH+(H-hudH-bh)/2);
  const s=36,y=hudH/2-s/2+4;
  btns.pause={x:bx,y,w:s,h:s};btns.sound={x:bx+s+8,y,w:s,h:s};
  // splash wall
  const ws=W/9,rows=Math.ceil(H/ws)+1;wall.length=0;
  const cols=['#ff4d6d','#ffb703','#5fe02a','#00c8ff','#3a6bff','#f02bf0','#ff9100','#ffd400'];
  for(let r=0;r<rows;r++)for(let c=0;c<9;c++)wall.push({r,c,col:cols[Math.floor(Math.random()*cols.length)],d:Math.random()*350,x:c*ws,y:r*ws,s:ws,rnd:Math.random()});
}
function hit(b,x,y){return x>=b.x-6&&x<=b.x+b.w+6&&y>=b.y-6&&y<=b.y+b.h+6}
function togglePause(){
  if(phase!=='play'||clearing&&false)return;
  paused=!paused;sfx.ui();
}
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();unlock();
  const x=e.clientX,y=e.clientY;
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
  if(phase==='splash'){startIntro();return}
  if(phase==='intro'){if(introT>500)introT=Math.max(introT,2300);return}
  if(phase==='over'){if(overT>700){newGame();phase='play';sfx.start();}return}
  if(phase!=='play')return;
  if(hit(btns.pause,x,y)){togglePause();g=null;return}
  if(hit(btns.sound,x,y)){muted=!muted;lsSet('blockdrop_muted',muted?'1':'0');if(!muted)sfx.ui();g=null;return}
  if(paused){paused=false;sfx.ui();g=null;return}
  if(e.pointerType==='mouse'){slam();return}
  g={sx:x,sy:y,lx:x,acc:0,t0:performance.now(),moved:false,slammed:false};
},{passive:false});
cv.addEventListener('pointermove',e=>{
  if(e.pointerType==='mouse'){hoverTo(e.clientX);return}
  if(!g||phase!=='play'||paused)return;
  e.preventDefault();
  const x=e.clientX,y=e.clientY;
  g.acc+=x-g.lx;g.lx=x;
  const step=cell*.9;
  while(g.acc>step){tryMove(1);g.acc-=step;g.moved=true}
  while(g.acc<-step){tryMove(-1);g.acc+=step;g.moved=true}
  const dy=y-g.sy,dx=x-g.sx;
  if(!g.slammed&&dy>cell*2&&dy>Math.abs(dx)*1.5){g.slammed=true;slam()}
},{passive:false});
function endPtr(e){
  if(!g)return;
  const dt=performance.now()-g.t0;
  const dist=Math.hypot(e.clientX-g.sx,e.clientY-g.sy);
  if(!g.moved&&!g.slammed&&dt<350&&dist<cell*.7)tryRotate();
  g=null;
}
cv.addEventListener('pointerup',endPtr);
cv.addEventListener('pointercancel',()=>{g=null});
window.addEventListener('keydown',e=>{
  unlock();
  const k=e.key;
  if(phase==='splash'&&(k===' '||k==='Enter')){startIntro();return}
  if(phase==='over'&&overT>700&&(k===' '||k==='Enter')){newGame();phase='play';sfx.start();return}
  if(phase!=='play')return;
  if(k==='p'||k==='Escape'){togglePause();return}
  if(k.startsWith('Arrow')||k===' ')e.preventDefault();
  if(k==='ArrowLeft')tryMove(-1);
  else if(k==='ArrowRight')tryMove(1);
  else if(k==='ArrowUp'||k==='x'||k===' ')tryRotate();
  else if(k==='ArrowDown')softDrop();
  else if(k==='Enter')slam();
});
let lastWheel=0;
cv.addEventListener('wheel',e=>{
  e.preventDefault();
  const n=performance.now();
  if(n-lastWheel<110)return;
  lastWheel=n;unlock();tryRotate();
},{passive:false});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&phase==='play')paused=true});
document.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('resize',layout);

function startIntro(){phase='intro';introT=0;bannerT=0;newGame();sfx.whoosh()}

/* ---------- update ---------- */
let lastSparkle=0;
function update(dt){
  const s=dt/1000;
  // global fx
  for(const p of particles){p.t+=s;p.x+=p.vx*s;p.y+=p.vy*s;if(p.k!=='spark')p.vy+=420*s}
  particles=particles.filter(p=>p.t<p.life);
  for(const p of pops)p.t+=s;pops=pops.filter(p=>p.t<1);
  for(const t of trails)t.t+=s;trails=trails.filter(t=>t.t<.35);
  shake*=Math.pow(.001,s);if(shake<.2)shake=0;
  flash=Math.max(0,flash-s);
  if(bannerT>=0){bannerT+=dt;if(bannerT>3600)bannerT=-1}
  if(phase==='splash')splashT+=dt;
  if(phase==='intro'){
    introT+=dt;
    if(introT<1500&&introT-lastSparkle>45){
      lastSparkle=introT;
      const wf=Math.min(1,introT/800);
      for(let i=0;i<3;i++)particles.push({x:Math.random()*W,y:H*(1-wf*Math.random()),vx:(Math.random()-.5)*20,vy:-20-Math.random()*40,life:.8,t:0,s:3+Math.random()*4,k:'spark',col:'#fff'});
      if(Math.random()<.4)sfx.sparkle();
    }
    if(introT>=2500){phase='play';sfx.start()}
  }
  if(phase==='play'&&!paused){
    if(clearing){clearing.t+=dt;if(clearing.t>=300)finishClear()}
    else if(cur){
      if(grounded()){
        lockT+=dt;
        if(lockT>=450)lock(false);
      } else {
        lockT=0;dropAcc+=dt;const iv=interval();
        while(dropAcc>=iv){dropAcc-=iv;if(!collide(cur.m,cur.x,cur.y+1))cur.y++;else break}
      }
    }
  }
  if(phase==='closing'){
    closeT+=dt;
    if(closeT>ROWS*40+500){phase='over';overT=0;if(newBest)sfx.best()}
  }
  if(phase==='over')overT+=dt;
}

/* ---------- drawing ---------- */
function shade(hex,a){
  const n=parseInt(hex.slice(1),16);let r=n>>16,g=(n>>8)&255,b=n&255;
  if(a>=0){r+=(255-r)*a;g+=(255-g)*a;b+=(255-b)*a}else{r*=1+a;g*=1+a;b*=1+a}
  return `rgb(${r|0},${g|0},${b|0})`;
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function block(x,y,s,col,alpha){
  x=Math.round(x);y=Math.round(y);s=Math.round(s);
  if(alpha!==undefined)ctx.globalAlpha=alpha;
  const b=Math.max(2,Math.round(s*.13));
  // dark rim / shadow facet
  ctx.fillStyle=shade(col,-.42);ctx.fillRect(x,y,s,s);
  // vivid face
  const gr=ctx.createLinearGradient(0,y,0,y+s);
  gr.addColorStop(0,shade(col,.18));gr.addColorStop(.5,col);gr.addColorStop(1,shade(col,-.12));
  ctx.fillStyle=gr;ctx.fillRect(x+b,y+b,s-b*2,s-b*2);
  // bright top + left bevel
  ctx.fillStyle=shade(col,.6);
  ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+s,y);ctx.lineTo(x+s-b,y+b);ctx.lineTo(x+b,y+b);ctx.lineTo(x+b,y+s-b);ctx.lineTo(x,y+s);ctx.closePath();ctx.fill();
  // medium bottom + right bevel
  ctx.fillStyle=shade(col,-.28);
  ctx.beginPath();ctx.moveTo(x+s,y);ctx.lineTo(x+s,y+s);ctx.lineTo(x,y+s);ctx.lineTo(x+b,y+s-b);ctx.lineTo(x+s-b,y+s-b);ctx.lineTo(x+s-b,y+b);ctx.closePath();ctx.fill();
  // glossy highlight on upper half
  const gl=ctx.createLinearGradient(0,y+b,0,y+s*.55);
  gl.addColorStop(0,'rgba(255,255,255,.55)');gl.addColorStop(1,'rgba(255,255,255,.08)');
  ctx.fillStyle=gl;ctx.fillRect(x+b,y+b,s-b*2,Math.round(s*.55-b));
  if(alpha!==undefined)ctx.globalAlpha=1;
}
function text(t,x,y,size,col,align,weight){
  ctx.font=`${weight||'800'} ${size}px "Trebuchet MS","Segoe UI",system-ui,sans-serif`;
  ctx.fillStyle=col;ctx.textAlign=align||'left';ctx.textBaseline='middle';ctx.fillText(t,x,y);
}
function drawBG(){
  const gr=ctx.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#0b1250');gr.addColorStop(1,'#050820');
  ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
}
function drawHUD(){
  // buttons
  for(const k of ['pause','sound']){
    const b=btns[k];
    ctx.fillStyle='rgba(60,80,220,.35)';rr(b.x,b.y,b.w,b.h,8);ctx.fill();
    ctx.strokeStyle='rgba(120,150,255,.7)';ctx.lineWidth=1.5;rr(b.x,b.y,b.w,b.h,8);ctx.stroke();
    ctx.fillStyle='#bcd0ff';
    if(k==='pause'){
      if(paused){ctx.beginPath();ctx.moveTo(b.x+13,b.y+10);ctx.lineTo(b.x+27,b.y+18);ctx.lineTo(b.x+13,b.y+26);ctx.fill()}
      else{ctx.fillRect(b.x+11,b.y+10,5,16);ctx.fillRect(b.x+20,b.y+10,5,16)}
    } else {
      ctx.beginPath();ctx.moveTo(b.x+9,b.y+14);ctx.lineTo(b.x+14,b.y+14);ctx.lineTo(b.x+20,b.y+9);ctx.lineTo(b.x+20,b.y+27);ctx.lineTo(b.x+14,b.y+22);ctx.lineTo(b.x+9,b.y+22);ctx.fill();
      if(muted){ctx.strokeStyle='#ff6b8a';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(b.x+24,b.y+12);ctx.lineTo(b.x+32,b.y+24);ctx.moveTo(b.x+32,b.y+12);ctx.lineTo(b.x+24,b.y+24);ctx.stroke()}
      else{ctx.strokeStyle='#bcd0ff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(b.x+21,b.y+18,6,-.9,.9);ctx.stroke();ctx.beginPath();ctx.arc(b.x+21,b.y+18,11,-.9,.9);ctx.stroke()}
    }
  }
  const tx=bx+bw/2-10;
  text('SCORE',tx-26,hudH/2-14,12,'#6fa8ff','center','800');
  text(String(score),tx-26,hudH/2+8,28,'#fff','center','900');
  text('BEST '+best,tx-26,hudH/2+30,11,'#7f8fd8','center','700');
  // next box
  const nb=Math.min(hudH-14,74),nx=bx+bw-nb,ny=(hudH-nb)/2+4;
  ctx.fillStyle='rgba(10,20,90,.8)';rr(nx,ny,nb,nb,6);ctx.fill();
  ctx.strokeStyle='#8fa8ff';ctx.lineWidth=2;rr(nx,ny,nb,nb,6);ctx.stroke();
  text('NEXT',nx+nb/2,ny+10,10,'#9fb4ff','center','800');
  if(nextT){
    const t=TYPES[nextT],m=t.m,s=Math.min(14,(nb-16)/Math.max(m[0].length,3));
    const ox=nx+(nb-m[0].length*s)/2,oy=ny+14+(nb-14-m.length*s)/2;
    for(let r=0;r<m.length;r++)for(let c=0;c<m[r].length;c++)if(m[r][c])block(ox+c*s,oy+r*s,s,t.c);
  }
}
function drawBoard(){
  ctx.fillStyle='rgba(20,35,150,.35)';ctx.fillRect(bx,by,bw,bh);
  ctx.strokeStyle='rgba(90,120,255,.13)';ctx.lineWidth=1;ctx.beginPath();
  for(let c=1;c<COLS;c++){ctx.moveTo(bx+c*cell+.5,by);ctx.lineTo(bx+c*cell+.5,by+bh)}
  for(let r=1;r<ROWS;r++){ctx.moveTo(bx,by+r*cell+.5);ctx.lineTo(bx+bw,by+r*cell+.5)}
  ctx.stroke();
  ctx.shadowColor='#3b5bff';ctx.shadowBlur=14;ctx.strokeStyle='#3d55e0';ctx.lineWidth=2;ctx.strokeRect(bx-1,by-1,bw+2,bh+2);ctx.shadowBlur=0;
  // trails
  for(const t of trails){
    const a=1-t.t/.35;
    const x=bx+t.col*cell,y0=by+t.r0*cell,y1=by+t.r1*cell;
    const top=Math.max(by,y0-cell*6);
    const gr=ctx.createLinearGradient(0,top,0,y1);
    gr.addColorStop(0,'rgba(255,255,255,0)');gr.addColorStop(1,shade(t.c,.3));
    ctx.globalAlpha=a*.8;ctx.fillStyle=gr;ctx.fillRect(x+2,top,cell-4,y1-top);ctx.globalAlpha=1;
  }
  // settled
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const v=grid[r][c];if(v)block(bx+c*cell,by+r*cell,cell,v);
  }
  if(clearing){
    const k=clearing.t/300;
    for(const r of clearing.rows){
      ctx.fillStyle=`rgba(255,255,255,${Math.min(1,.4+k)* (1-k*.6)})`;
      const w=bw*(1-k*.0);ctx.fillRect(bx,by+r*cell,w,cell);
    }
  }
  // ghost + current
  if(cur&&phase==='play'){
    let gy=cur.y;while(!collide(cur.m,cur.x,gy+1))gy++;
    for(let r=0;r<cur.m.length;r++)for(let c=0;c<cur.m[r].length;c++)if(cur.m[r][c]){
      const x=bx+(cur.x+c)*cell,y=by+(gy+r)*cell;
      ctx.fillStyle='rgba(60,80,200,.35)';ctx.fillRect(x+2,y+2,cell-4,cell-4);
      ctx.strokeStyle='rgba(150,170,255,.7)';ctx.lineWidth=1.5;ctx.strokeRect(x+2.5,y+2.5,cell-5,cell-5);
    }
    for(let r=0;r<cur.m.length;r++)for(let c=0;c<cur.m[r].length;c++)if(cur.m[r][c]){
      if(cur.y+r>=0)block(bx+(cur.x+c)*cell,by+(cur.y+r)*cell,cell,cur.c);
    }
  }
}
function drawFX(){
  for(const p of particles){
    const a=1-p.t/p.life;ctx.globalAlpha=Math.max(0,a);ctx.fillStyle=p.col;
    if(p.k==='dia'||p.k==='spark'){
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(Math.PI/4);
      if(p.k==='spark'){ctx.fillStyle='#fff';ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s)}
      else{ctx.strokeStyle=p.col;ctx.lineWidth=1.5;ctx.strokeRect(-p.s/2,-p.s/2,p.s,p.s)}
      ctx.restore();
    } else {ctx.beginPath();ctx.arc(p.x,p.y,p.s,0,7);ctx.fill()}
  }
  ctx.globalAlpha=1;
  for(const p of pops){
    ctx.globalAlpha=1-p.t;text(p.text,p.x,p.y-p.t*50,Math.max(18,cell*.8),'#7df9ff','center','900');
  }
  ctx.globalAlpha=1;
  if(flash>0){ctx.fillStyle=`rgba(180,210,255,${flash*.5})`;ctx.fillRect(0,0,W,H)}
}
function banner(){
  if(bannerT<0)return;
  let t=bannerT,sc=1,a=1,oy=0;
  if(phase==='splash')return;
  const T0=900; // start (relative to intro start)
  const tt=t-T0;if(tt<0)return;
  if(tt<300){const k=tt/300;sc=.3+.7*(1-Math.pow(1-k,3))+Math.sin(k*Math.PI)*.08;a=k}
  else if(tt>1800){const k=Math.min(1,(tt-1800)/700);oy=-k*H*.4;a=1-k;sc=1-k*.3}
  const w=Math.min(W*.82,360),h=96,cx=W/2,cy=H*.4+oy;
  ctx.save();ctx.globalAlpha=Math.max(0,a);ctx.translate(cx,cy);ctx.scale(sc,sc);
  ctx.fillStyle='rgba(20,30,140,.92)';rr(-w/2,-h/2,w,h,8);ctx.fill();
  ctx.strokeStyle='#7f94ff';ctx.lineWidth=4;ctx.shadowColor='#4a63ff';ctx.shadowBlur=18;rr(-w/2,-h/2,w,h,8);ctx.stroke();ctx.shadowBlur=0;
  text('LIMITLESS',0,-16,30,'#53e0ff','center','900');
  text('No levels. No limits.',0,24,17,'#fff','center','700');
  ctx.restore();
}
function drawWallCell(w,col,pop,alpha){
  const s=w.s*pop;if(s<=0)return;
  ctx.globalAlpha=alpha;block(w.x+(w.s-s)/2,w.y+(w.s-s)/2,s,col);ctx.globalAlpha=1;
}
function drawSplash(){
  const t=splashT;
  for(const w of wall){
    const k=Math.min(1,Math.max(0,(t-w.d)/200));
    const pop=k<1?k*1.15:1+Math.sin(t/400+w.rnd*6)*.02;
    drawWallCell(w,w.col,pop,1);
  }
  ctx.fillStyle='rgba(5,8,32,.55)';ctx.fillRect(0,0,W,H);
  const bob=Math.sin(t/500)*4;
  const fs1=Math.min(56,W*.112),fs2=Math.min(72,W*.19);
  text('LIMITLESS',W/2,H*.34+bob,fs1,'#fff','center','900');
  text('TETRIS',W/2,H*.34+fs1*.5+fs2*.62+bob,fs2,'#53e0ff','center','900');
  ctx.globalAlpha=.5+.5*Math.sin(t/300);
  text('TAP TO START',W/2,H*.72,20,'#fff','center','800');ctx.globalAlpha=1;
  const fine=window.matchMedia&&matchMedia('(pointer:fine)').matches;
  const hs=Math.min(12,W*.029);
  if(fine){text('Mouse: hover = move · wheel = rotate · click = slam',W/2,H*.88,hs,'#b9c6ff','center','600');text('Keys: ← → move · ↓ step · Space rotate · Enter slam',W/2,H*.91,hs,'#b9c6ff','center','600')}
  else text('Tap = rotate  ·  Swipe sideways = move  ·  Swipe down = slam',W/2,H*.9,hs,'#b9c6ff','center','600');
  footer();
}
function drawIntroOverlay(){
  const t=introT,rows=Math.ceil(H/(W/9))+1;
  for(const w of wall){
    const rank=(rows-1-w.r)+Math.abs(w.c-4)*.5;
    const wipeP=Math.min(1,t/800)*(rows+4);
    let col=w.col,alpha=1;
    if(rank<wipeP)col='#ffffff';
    if(t>800){alpha=1-Math.min(1,Math.max(0,(t-800-w.rnd*400)/400))}
    if(alpha>0)drawWallCell(w,col,1,alpha);
  }
}
function drawClosing(){
  const n=Math.min(ROWS,Math.floor(closeT/40));
  for(let i=0;i<n;i++){
    const r=ROWS-1-i;
    for(let c=0;c<COLS;c++){block(bx+c*cell,by+r*cell,cell,'#dfe8ff')}
  }
  if(closeT>ROWS*40){
    const k=Math.min(1,(closeT-ROWS*40)/500);
    ctx.fillStyle=`rgba(5,8,32,${k*.7})`;ctx.fillRect(0,0,W,H);
  }
}
function drawOver(){
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)block(bx+c*cell,by+r*cell,cell,'#dfe8ff',.15);
  ctx.fillStyle='rgba(5,8,32,.8)';ctx.fillRect(0,0,W,H);
  const k=Math.min(1,overT/300),e=1-Math.pow(1-k,3);
  const w=Math.min(W*.84,360),h=250,cx=W/2,cy=H/2;
  ctx.save();ctx.globalAlpha=e;ctx.translate(cx,cy+(1-e)*40);
  ctx.fillStyle='rgba(20,30,140,.95)';rr(-w/2,-h/2,w,h,10);ctx.fill();
  ctx.strokeStyle='#7f94ff';ctx.lineWidth=4;ctx.shadowColor='#4a63ff';ctx.shadowBlur=18;rr(-w/2,-h/2,w,h,10);ctx.stroke();ctx.shadowBlur=0;
  text('GAME OVER',0,-88,30,'#ff6b8a','center','900');
  text('SCORE',0,-48,13,'#8fb0ff','center','800');
  text(String(score),0,-14,46,'#fff','center','900');
  if(newBest)text('★ NEW BEST! ★',0,26,18,'#ffd84a','center','900');
  else text('BEST '+best,0,26,17,'#9fb4ff','center','700');
  text('LINES '+lines,0,56,14,'#9fb4ff','center','700');
  if(overT>700){ctx.globalAlpha=e*(.5+.5*Math.sin(overT/250));text('TAP TO PLAY AGAIN',0,94,17,'#53e0ff','center','900')}
  ctx.restore();
}
function drawPaused(){
  ctx.fillStyle='rgba(5,8,32,.75)';ctx.fillRect(0,0,W,H);
  text('PAUSED',W/2,H*.45,40,'#fff','center','900');
  text('Tap to resume',W/2,H*.52,18,'#53e0ff','center','700');
}

function footer(){text('Created by Madeeha Anwar',W/2,H-8,9,'rgba(170,185,255,.6)','center','600')}
function draw(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  drawBG();
  if(phase==='splash'){drawSplash();return}
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  drawHUD();drawBoard();
  if(phase==='closing')drawClosing();
  ctx.restore();
  drawFX();
  if(phase==='intro')drawIntroOverlay();
  banner();
  if(phase==='over')drawOver();
  if(paused&&phase==='play')drawPaused();
  footer();
}

let last=performance.now();
function loop(now){
  const dt=Math.min(50,now-last);last=now;
  update(dt);draw();requestAnimationFrame(loop);
}
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
layout();newGame();
requestAnimationFrame(loop);
})();
</script>
